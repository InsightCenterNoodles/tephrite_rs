[package]
name = "tephrite_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
bitflags = "2"
bevy = { version = "0.18.1", features = ["jpeg", "exr"] }
bytemuck = "1"
itertools = "*"
thiserror = "*"
libc = "0.2"
serde = { version = "*", features = ["derive"] }
toml = "0.9"
cosmic-text = "*"
crossbeam-queue = "*"

[patch.crates-io]
bevy = { git = "https://github.com/nicholasbl/bevy", branch = "cave_patches" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
nix = "0.30"
rand = "0.9"

[[test]]
name = "shmem_integration"
harness = false

[[test]]
name = "shared_buffer"
harness = false

[[test]]
name = "replication_integration"
harness = false
