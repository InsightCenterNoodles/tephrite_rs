[package]
name = "tephrite_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
bitflags = "2"
bevy = { version = "0.19.0", features = ["jpeg", "exr", "debug"] }
bytemuck = "1"
itertools = "*"
thiserror = "*"
half = "*"
libc = "0.2"
serde = { version = "*", features = ["derive"] }
toml = "0.9"
cosmic-text = "*"
crossbeam-queue = "*"
bevy_rich_text3d = "0.7"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
criterion = "0.8"
nix = "0.30"
rand = "0.9"


[[test]]
name = "shmem_integration"
harness = false

[[test]]
name = "shared_buffer"
harness = false

[[test]]
name = "replication_integration"
harness = false

[[bench]]
name = "asset_serialization"
harness = false
